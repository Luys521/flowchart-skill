<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>flowchart-skill 自举：一条流程从材料到交付</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei","Segoe UI",sans-serif; background:#f0f2f5; padding:20px; }
.chart-container { position:relative; margin:0 auto; width:1000px; height:3530px;
                   background:white; border:1px solid #ddd; box-shadow:0 2px 8px rgba(0,0,0,0.1); overflow:auto; }
.node-tooltip { position:fixed; background:#fffef5; border:1px solid #d6b656; border-radius:6px;
                padding:10px 14px; box-shadow:0 4px 16px rgba(0,0,0,0.18); z-index:2000;
                max-width:320px; font-size:12px; line-height:1.6; pointer-events:none; display:none; }
.node-tooltip .tt-title { font-weight:bold; color:#9673a6; margin-bottom:6px;
                          border-bottom:1px solid #f0e6d2; padding-bottom:4px; }
/* "这里能点"就写在**节点名右侧**（见 D-80）：悬浮框是"用户已经伸手去点"的那一刻，
   在此处说一句最省事，也最不会跟节点内那几行语义文字抢地方。灰字、比名称小一号。 */
.node-tooltip .tt-sub { font-weight:normal; font-size:11px; color:#999999; margin-left:8px; }
.node-tooltip .tt-content { color:#444; white-space:pre-line; }
svg { display:block; }
.t1 { font-size:12px; font-weight:bold; fill:#333333; text-anchor:middle; }
.tm { font-size:10px; fill:#555555; text-anchor:middle; }
.tt2 { font-size:10px; font-weight:bold; fill:#b45309; text-anchor:middle; }
.lab { font-size:11px; font-weight:bold; text-anchor:middle; }
.lab-r { fill:#ffffff; stroke-width:1; }
.shape { stroke-width:2; }
/* 可下钻节点的记号是**框内一道内衬线**（同形状内缩 2px / 1px / 55%，见 D-78）：
   它在包围盒内，所以端口、连线、相邻墨迹、包围盒与网格一样都不碰。静态可见是它的本分。
   **它没有动画**：曾经悬停时另跑一段光沿它转一圈，与"连线上已经在跑的那道流光"重复了一遍
   （见 D-80），撤掉了——"这里能点"改由悬浮框标题行右侧的灰字说。 */
.ndg { cursor:default; }
.ndg[data-sub] { cursor:pointer; }
.ndg:hover .shape { stroke-width:3; }
/* 子图/主图之间的面包屑：走进去要能走出来，否则下钻比不做还糟。*/
.crumbs { position:fixed; top:0; left:0; z-index:1600; padding:6px 14px;
          font-size:12px; color:#555555; text-decoration:none;
          background:#ffffff; border-right:1px solid #e1d5e7; border-bottom:1px solid #e1d5e7;
          border-bottom-right-radius:6px; }
.crumbs:hover { color:#185FA5; background:#f5f9ff; }
/* 标题模块与面包屑都是 fixed，左上一角会重叠——有面包屑时把标题模块整体下移一格。*/
.headmod.has-crumbs { padding-top:34px; }
.edge { stroke-width:2; fill:none; }
/* 主干边上的**流光** = **两层同一道光**（见 D-79）：晕（宽 + 模糊 + 暗）+ 芯（窄 + 实 + 加深）。
   **一律不用白色**：白只在深色底上发光（svg-flow 的默认轨道 #1a1a2e、ECharts 的深色地图），
   我们的底是白画布与浅色填充——白在那儿只能"把线擦亮"，读作擦除而不是发光。
   两层共用同一套 dash 与时长 ⇒ 芯和晕一起走。`.is-run` 只挂在晕上、芯用**相邻兄弟**选择器跟随：
   JS 那套"实线边 ↔ 流光元素"的一一配对因此不用改（层数变了，配对仍是 1:1）。
   纯装饰、不承载语义 ⇒ 「减少动态效果」时直接不画；底边仍在，信息一点不丢。 */
.edge-flow { fill:none; stroke:#4a86c8; stroke-width:9.0;
              stroke-opacity:0.4;
              stroke-linecap:round; stroke-dasharray:12 18;
              stroke-dashoffset:30;
              opacity:0; pointer-events:none; }
.edge-flow-core { fill:none; stroke:#2f6fb4; stroke-width:3.0;
                   stroke-linecap:round; stroke-dasharray:12 18;
                   stroke-dashoffset:30;
                   opacity:0; pointer-events:none; }
/* **悬停期间循环**：只在悬停相关节点时给叠层挂 .is-run，鼠标离开就摘掉（JS）。
   为什么不是跑一趟：一触发就跑完即停，光一闪而过，反而像"页面抖了一下"——
   循环才读得出"光顺着流程一条条走下去"这件事。为什么**不是常驻**：常驻会把"实线/虚线"
   这条作者语义磨掉，也看不出这束光是在回答"我现在看着谁"（第一版就是常驻无限循环）。
   为什么不给相关边加粗：同一个意思说两遍——边上的光已经在回答"哪儿相关"，实线/虚线的
   线宽口径也就不必为悬停再开一个例外（见 D-80）。 */
.edge-flow.is-run, .edge-flow.is-run + .edge-flow-core {
                     animation:edge-flow-trace 1600ms linear infinite;
                     animation-delay:calc(var(--step, 0) * 120ms); }
@keyframes edge-flow-trace {
  0%   { stroke-dashoffset:30; opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:1; }
  100% { stroke-dashoffset:0; opacity:0; }
}
/* 悬停：**只加不减**。悬停节点自己的描边加粗由 `.ndg:hover .shape` 给（静态记号，
   「减少动态效果」下也成立），相关主干边在悬停期间循环跑流光。
   **不压暗任何东西**：压暗（曾经 0.13）会连 ⚠ 的橙/红描边、主体配色、执行者小字一起抹掉，
   那是**删信息**；而"哪些是相关的"已经有加法记号，不需要再来一遍减法（见 D-76）。 */
@media (prefers-reduced-motion: reduce) {
  .edge-flow { display:none; }
}
/* 标题模块：与正文模块（画布）分离的一块，固定在视窗顶部；滚动时不离视窗。
   底部内边距由脚本按实际高度回填，长图滚到哪都看得到"这是什么图 / 颜色是谁"。*/
.headmod { position:fixed; top:0; left:0; right:0; z-index:1500; background:#ffffff;
           border-bottom:1px solid #e1d5e7; box-shadow:0 1px 4px rgba(0,0,0,0.08);
           padding:10px 20px 12px; }
.headmod h1 { font-size:16px; font-weight:bold; color:#333333; text-align:center; margin:0 0 8px; }
.headmod .legend { display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
                    gap:6px 18px; font-size:11px; color:#555555; }
.headmod .lg { display:inline-flex; align-items:center; gap:6px; }
.headmod .sw { display:inline-block; width:34px; height:14px; border:1.5px solid; border-radius:3px; }

/* 单文件多视图（见 D-52）：子图内嵌为视图，点下钻切视图而不是跳页。 */
.view { display:none; }
.view.cur { display:block; }
.crumbs a { color:#555555; text-decoration:none; padding:2px 8px; border-radius:4px; }
.crumbs a:hover { color:#185FA5; background:#f5f9ff; }
.crumbs .sep { color:#aaaaaa; }
.crumbs .here { color:#9673a6; font-weight:bold; padding:2px 8px; }
</style>
</head>

<script>
var TIPS = {"01": {"title": "01 收到材料", "subject": "用户", "executor": "用户", "input": "原始材料、起止范围", "basis": null, "output": "原始材料（转交 01a）", "up": "15", "time": null, "route": "→建目录", "desc": "一次任务的入口：目录 / 单份文件 / 一段口头需求都算，**材料只读、永不修改**。触发形态不限：口头需求 / 合同文档 / 表格 / 图片白板 / **已被直接改过的流程表**；**15 的答复也从这里进来**——每轮补充的信息都是新材料，这张表的入口不止开一次", "pend": null, "sub": null}, "01a": {"title": "01a 建目录", "subject": "脚本", "executor": "init.py", "input": "流程名称", "basis": "两份模板与目录约定（`SKILL.md` 读材料段）", "output": "`\u003c成果根\u003e/\u003c流程名\u003e/` + 两份模板", "up": "01", "time": "1-2 秒", "route": "→手上是已有图吗？", "desc": "材料没给流程名时按材料主题起一个（原文未写、按惯例补）。`init.py \u003c流程名\u003e -d \u003c成果根\u003e` 建目录并把 `templates/` 两份模板拷进去——**目录名就是流程身份**，产物名跟着它走", "pend": "此处为 AI 推断，原文未载明", "sub": null}, "01b": {"title": "01b 手上是已有图吗？", "subject": "AI", "executor": "AI", "input": "原始材料", "basis": "入口 B：图里的拓扑与流程表同构（`references/import-existing.md` §1）", "output": "已有图 / 不是", "up": "01a", "time": null, "route": "是→读一张已有的图\n否→读回现状对齐口径", "desc": "**两个入口在这一格分开**：不是已有图就走路 A（探测 → 解析 → 入账）；是已有图就走路 B——那张图**本身就是材料**，读它不需要探测分档。判据只看一件：手上这份东西**已经有拓扑**了没有", "pend": null, "sub": null}, "01c": {"title": "01c 读一张已有的图", "subject": "脚本 + AI", "executor": "xml_reader.py · import_table.py", "input": "一张已有流程图（本 SKILL 产的 / 别的工具画的 / 照片）", "basis": "路径与命名归一（`references/import-existing.md` §1）", "output": "节点与边（流程表的骨架）", "up": "01b", "time": "1-5 秒", "route": "→定范围：主体 / 目的 / 材料根", "desc": "三条路按**文件形态**分派：`.drawio` / `.xml` 走 `xml_reader.py` 出拓扑；**外部节点表**走 `import_table.py` 转成契约十二列；**照片 / 截图**走视觉（`certainty=inferred`，与 23 同一条纪律）。⚠ 读回来的只有名称 / 形状 / 连线 / 坐标，**语义属性图里一个都不写**——所以\"读不回\"是设计，不是缺陷", "pend": null, "sub": null}, "02": {"title": "02 读回现状对齐口径", "subject": "AI", "executor": "AI", "input": "已有流程表（可无）", "basis": "`⚠` / `⚠?` 的分拣口径（`references/flowtable-spec.md` §2）", "output": "现状复述", "up": "01b", "time": null, "route": "→探测分档", "desc": "**每轮开工第一件事：手上有什么就读什么**——已有流程表就用 `clarify.py` 读回来（它只读不写），报出哪些是 AI 推断、哪些还没定；没有表就把材料要点复述一遍，给用户当场纠正的机会。**已定的不重复问**——「还剩哪些要问」由 14 独家算", "pend": null, "sub": "parts/读回现状/flowtable.md"}, "03": {"title": "03 探测分档", "subject": "脚本", "executor": "probe.py", "input": "材料目录", "basis": "`SKILL.md` 读材料段（探测）", "output": "`materials[]`：档位 + 类型 + sha256 + 修改时间 + 扫描根", "up": "02", "time": "1-2 秒", "route": "→侦查：排序与假设", "desc": "**按内容判，不按扩展名**：同一个 `.pdf` 可以跨两档、改名件按魔数认。分档是**记账**不是门槛——读不动的逐份写明原因并给出路，探测结论一律进账，不许**默默用**、也不许**默默不用**。⚠ **材料根变了要回 03 重跑**：`05` 默认查这一条（记的 `root` 与根下当下对不上、或哪份 sha256 变了 ⇒ 告警；要硬拦加 `--strict-stale`）", "pend": null, "sub": null}, "04": {"title": "04 侦查：排序与假设", "subject": "脚本", "executor": "recon.py", "input": "`materials[]`", "basis": "`SKILL.md` 读材料段（侦查）", "output": "`recon.md`（难度排序 + 结构缩样 + 假设表草稿）", "up": "03", "time": "2-10 秒", "route": "→解析入账", "desc": "先廉价后昂贵：元数据 → 难度排序 → 先读易的。脚本只给机器可算的列（档位 / 规模 / 处置建议）；**「假设角色 / 依据 / 验证方式 / 状态」由 AI 填**，被推翻也要留痕（怎么落笔见 `SKILL.md` 读材料段的「AI 格」）", "pend": null, "sub": "parts/侦查/flowtable.md"}, "05": {"title": "05 解析入账", "subject": "脚本", "executor": "parse.py → ledger.py", "input": "`materials[]`", "basis": "`references/flowtable-spec.md` §3（证据层）· `references/material-to-nodes.md` §6", "output": "`evidence.json`（唯一事实源）", "up": "04、23", "time": "5-60 秒", "route": "→定范围：主体 / 目的 / 材料根", "desc": "适配器按固定顺序跑，收窄（`--only` / `--pages` / `--slides` / `--grep`）一律留痕。**这一步之后下游只许引用 element id，不许回头读原件**——「依据」列指的就是它们。⚠ 清洗的四条不许（不改字 / 不合并去重 / 不语义分类 / 不\"修好\"读不动的）在这里生效", "pend": null, "sub": null}, "06": {"title": "06 定范围：主体 / 目的 / 材料根", "subject": "AI ↔ 用户", "executor": "AI 问、用户答", "input": "已读到的材料 + 侦查结论", "basis": "`references/material-to-nodes.md` §1（先定主体与目的）", "output": "三格答复（落 `plan.md` 表头）", "up": "01c、05", "time": null, "route": "→要分堆吗？", "desc": "? **唯一一件值得在切句前打断的事**：答不出就先问，**不许拿\"材料里最强的那条流程\"当默认**（盲读实测里那么干过：表全绿、却答了另一条流程）。⚠ 放在认料之后是刻意的——没看见材料全貌之前，\"主体是谁\"问不到点子上；纪律只要求**在拆解之前**问清", "pend": "此处必须业务方拍板：AI 推不出，且不同选法后果不同", "sub": null}, "07": {"title": "07 要分堆吗？", "subject": "AI", "executor": "AI", "input": "含流程的材料 ≥ 3 份", "basis": "`SKILL.md` 清点段", "output": "分堆结论（材料 ↔ 流程归属）", "up": "06", "time": null, "route": "是→清点成卡片\n否→落流程表", "desc": "\"分堆不可跳过\"与\"清点、计划是**工位**不是开工前的关卡\"这两句同时成立 ⇒ 它只能落成一个**判断**：单份材料 / 单条流程时平凡成立、直接落表；多份材料才先分堆。纪律：**宁可多拆一条，不可错并两条**", "pend": "此处为 AI 推断，原文未载明", "sub": null}, "08": {"title": "08 清点成卡片", "subject": "AI", "executor": "AI（脚本 build/check）", "input": "`evidence.json`", "basis": "`SKILL.md` 清点段", "output": "`intake.md`（一份材料一行）", "up": "07", "time": null, "route": "→拆解成计划", "desc": "脚本先填机器列（档位 / 读不动 / `重复`）；**「主题 / 含流程 / 版本关系 / 依据」是 AI 填的**（`是` / `否` 必须给理由并标 `⚠`）。卡片是账本的**标注层**：只标注、不新增真值", "pend": null, "sub": null}, "09": {"title": "09 拆解成计划", "subject": "AI", "executor": "AI（脚本 build/check）", "input": "`intake.md`", "basis": "`SKILL.md` 计划段", "output": "`plan.md`（做几张 / 谁依赖谁 / 谁能并行）", "up": "08、10", "time": null, "route": "→计划要改吗？", "desc": "出种子 → 强合并（脚本做）→ 弱合并（AI 判：共享 ≥2 个起止点 / 交付物）→ 命名 → 定甲 / 乙 / 丙 → 并行分组。**要不要拆子流程、该并还是拆，是 AI 的判断**（写进「注记」并标 `⚠`），**不许写成澄清申请的问句**", "pend": null, "sub": null}, "10": {"title": "10 计划要改吗？", "subject": "用户", "executor": "用户", "input": "`plan.md`", "basis": "`SKILL.md` 计划段", "output": "用户的纠正", "up": "09", "time": null, "route": "改→回 拆解成计划\n不改→这次有流程吗？", "desc": "**人审这一层最便宜**：在计划阶段说一句\"这两条其实是一条\"，比画完两张图才发现便宜一个数量级。⚠ `plan.md` 不进机器门禁——两条 `check` 只核可机器核的那几条，不核\"拆得对不对\"", "pend": null, "sub": null}, "10b": {"title": "10b 这次有流程吗？", "subject": "AI", "executor": "AI", "input": "`plan.md` 的流程清单", "basis": "0 条流程也是一种结论（`SKILL.md` 计划段）", "output": "有 / 没有", "up": "10", "time": null, "route": "有→落流程表\n没有→本次不出图", "desc": "★ **\"没有\"必须是一条出口**：材料可能是纯技术条款 / 资质证明 / 数据手册，一条流程都拆不出来——这时**硬凑一张图**比交白卷坏得多（实测跑过：三份材料 0 条流程 + 3 条排除，那是正确结论）", "pend": null, "sub": null}, "11": {"title": "11 落流程表", "subject": "AI", "executor": "AI", "input": "材料 + 答复 + 计划", "basis": "字段登记表（`references/flowtable-spec.md` §2）", "output": "十二列流程表", "up": "07、10b、12、18、19、22", "time": null, "route": "→结构校验？", "desc": "★ 全流程**唯一**的语义落笔点：校验不通过、用户答复、图上的语义改动、表被直改、缺口派活，都回到这里改表。**列填不满的地方，就是流程没说清的地方**——主动提问、给出候选、补上缺失项", "pend": null, "sub": "parts/落表/flowtable.md"}, "12": {"title": "12 结构校验？", "subject": "脚本", "executor": "table_to_dsl.py", "input": "流程表", "basis": "H1–H8 + 表头 H9 + 证据层 H10（`references/flowtable-spec.md` §3）", "output": "通过，或逐条硬错误", "up": "11", "time": null, "route": "通过→逐行回看内容出处\n不通过→回 落流程表 修正\n仪器故障→停下报出（仪器故障）", "desc": "三层校验（① 节点：编号 / 语义 · ② 类型：起止、出边、分支 · ③ 关系：引用、连通、回路），硬错误**阻断渲染**。它拦得住**写错**的表，拦不住**理解错**的表", "pend": null, "sub": "parts/结构校验/flowtable.md"}, "13": {"title": "13 逐行回看内容出处", "subject": "AI", "executor": "AI", "input": "流程表", "basis": "依据不来自材料就标 `⚠`（`references/material-to-nodes.md` §6）", "output": "`⚠` / `⚠?` 留痕 + `checklist.md`", "up": "12", "time": null, "route": "→有待裁决项？", "desc": "材料说的照写并指到 element id；AI 按常理补的打 `⚠` 并写明依据；推不出的打 `⚠?`。**打标不阻断**——标完照常往下，仍未决的由 14 报出；**标完把推断项汇总成 `checklist.md`**（照 `templates/checklist-template.md` 自查）", "pend": null, "sub": "parts/回看出处/flowtable.md"}, "14": {"title": "14 有待裁决项？", "subject": "脚本", "executor": "clarify.py", "input": "流程表", "basis": "frontier = 前驱已定的 `⚠?`，只问当前可问的", "output": "frontier 清单", "up": "13", "time": null, "route": "有→问并收答复\n没有→渲染三份视图", "desc": "`clarify.py` 算出 frontier（当前能问的）——这是**算出来的状态**，不是看法；**只问 frontier 里的**，上游还没定的先不问。frontier 为空即收敛", "pend": null, "sub": null}, "15": {"title": "15 问并收答复", "subject": "用户", "executor": "用户", "input": "frontier 清单", "basis": null, "output": "答复（新材料）", "up": "14", "time": null, "route": "→回 收到材料 当新材料", "desc": "每问附 AI 的推荐答案，用户只需否决。**与 11 的分工**：11 问的是「列填不满」，这里问的是「两条路都说得通、必须业务方拍板」。**答复是新材料**——收完回 01 重走一圈再落表，不在问答处就地改表。仍有未决的照常交付，但交付时如实报「仍未决 N 处」", "pend": null, "sub": null}, "16": {"title": "16 渲染三份视图", "subject": "脚本", "executor": "build.py", "input": "通过校验的流程表", "basis": "六环 + 产物侧九项判据（`references/visual-spec.md` §4.1）", "output": "三份产物 + 层级索引 + sha256 回执", "up": "14、17、19", "time": "5-30 秒", "route": "→视觉自检通过？", "desc": "一条命令跑六环，任一环不过即 exit 1 并把产物还原——盘上不留没审过的交付物", "pend": null, "sub": "parts/渲染/flowtable.md"}, "17": {"title": "17 视觉自检通过？", "subject": "AI", "executor": "AI", "input": "三份产物", "basis": "看三样：交叉多不多 / 标签压不压线 / 走向反不反直觉（`references/visual-spec.md` §5）", "output": "看过的结论", "up": "16", "time": null, "route": "通过→表被直改过吗？\n有问题→回 渲染三份视图 调几何", "desc": "用 `shot.py` 出图后**由 AI 看着核对**：交叉是否多到影响追踪、标签是否居中压线、分支走向是否反直觉。质量门禁只管几何，好不好看必须看图", "pend": null, "sub": "parts/视觉自检/flowtable.md"}, "18": {"title": "18 表被直改过吗？", "subject": "脚本", "executor": "table_to_dsl.py", "input": "流程表 + 上次渲染记进契约的指纹", "basis": "现算指纹 vs `source_sha256`（`SKILL.md` 回流段）", "output": "同版 / 已过期", "up": "17", "time": null, "route": "有→回 落流程表 重走\n没有→读回并分拣改动", "desc": "★ 拿 `flowtable.md` 现算指纹，对照上次渲染写进 `\u003c流程名\u003e-flow.manifest.json` 的那一份（`table_to_dsl.py --fresh`）：**变过**说明有人绕过流水线改了事实源，回 11 重走校验与出图——**不许走 19**（回灌是按图里的节点集合重建表格行的，手工加的节点会被删掉、改过的名字会被覆盖）；**没变**→19 看图上动了什么。没有基线时 `--fresh` 报「无从判断」，照样按「改过」走保守路线", "pend": null, "sub": null}, "19": {"title": "19 读回并分拣改动", "subject": "脚本", "executor": "sync.py", "input": "drawio + 流程表", "basis": "差异四分类（增删节点 / 关系变化 / 文字变化 / 坐标位移）", "output": "回写后的流程表", "up": "18", "time": "2-10 秒", "route": "都没变→对账：漂移\n改了语义→回 落流程表 重落表\n只动几何→回 渲染三份视图 重布局", "desc": "**图这一面不另存指纹——本来就要解析**：元素与关系都没变、只有坐标位移 → 几何，回 16 交算法判吸附阈值（**像素不作终值**）；**增删节点 / 改关系 / 改文字（含名称、标签、形状）→ 语义**，先回写进流程表，再回 11 重走校验与出图。两者都有时按语义走；**diff 为空即静默通过**，不许因格式噪声把人拉回 11", "pend": null, "sub": "parts/同步回写/flowtable.md"}, "20": {"title": "20 对账：漂移", "subject": "脚本", "executor": "drift.py", "input": "流程表 + 账本 + 假设账 + 清点", "basis": "`SKILL.md` 循环段（D1—D5 与缺口清单）", "output": "`drift.md`（漂移账 + 缺口清单 + 依据分布）", "up": "19", "time": "2-10 秒", "route": "→收敛了吗？", "desc": "★ **循环的发动机**：拿表去比\"已经知道的\"（账本 / 假设账 / 清点）。分得清两类：**\"表写错了\"** → 漂移账；**\"还有东西没看\"** → 缺口清单，它**派活**。对不上的逐条给「走哪条路」，AI 只需填处置与依据", "pend": null, "sub": "parts/对账/flowtable.md"}, "21": {"title": "21 收敛了吗？", "subject": "脚本", "executor": "drift.py check", "input": "`drift.md`", "basis": "收敛判据：硬漂移 0 且没有「待取证」（`SKILL.md` 循环段）", "output": "收敛结论", "up": "20", "time": null, "route": "收敛→交付\n没收敛→缺口在哪一头？\n仪器故障→停下报出（仪器故障）", "desc": "★ 收敛才许交付：每条漂移都要有处置（`已修` 会被重跑判据验真，`已解释` 必须写依据），每条缺口都要有结论（`已取证` 写清要哪一片、`已放弃` 写理由）。⚠ 超预算（每份材料攻坚上限 2 轮）的落 `⚠?` 交用户——**不许无限重试**", "pend": null, "sub": null}, "22": {"title": "22 缺口在哪一头？", "subject": "AI", "executor": "AI", "input": "缺口清单", "basis": "两类缺口的二分（`SKILL.md` 循环段）", "output": "材料侧 / 表侧", "up": "21", "time": null, "route": "材料侧→攻坚：点名取子集再读\n表侧→回 落流程表", "desc": "分得清才派得对活：**材料侧** = 还有东西没看（去 23 撬开）；**表侧** = 看过了没写进去（回 11 改表）。这一问不许跳过——把两类混成一句\"再补补\"，等于没派活", "pend": null, "sub": null}, "23": {"title": "23 攻坚：点名取子集再读", "subject": "脚本", "executor": "query.py · render_pages.py", "input": "缺口清单", "basis": "只查不抽 · 一批一小口 + 游标（`SKILL.md` 循环段）", "output": "只取该看的那几处（不灌满上下文）", "up": "22", "time": "1-5 秒", "route": "→回 解析入账 重新入账", "desc": "`query.py` 按材料 / 词 / 行段点名取子集；`render_pages.py` 把扫描件与质量门不过的材料渲成图交给会看图的模型（**视觉来源一律按推断档**：`certainty` 不是逐字引用）。取回的东西**必须回 05 重新入账**，不许直接落表——绕过账本等于给「依据」列造一条查不到的引用", "pend": null, "sub": null}, "24": {"title": "24 交付", "subject": "用户", "executor": "用户", "input": "19 的回写结果 + 全部产物", "basis": null, "output": "三视图 + `flowtable.md` + `checklist.md` + 层级索引", "up": "21", "time": null, "route": "—", "desc": "三份视图（html 评审 / drawio 协作 / svg 中间态）+ `flowtable.md`（唯一事实源）+ `checklist.md`（自检报告）+ `\u003c流程名\u003e-index.md`（层级索引，多张表时的构建顺序）。**有子表就一并发 `parts/`**。产物末尾打印 sha256 回执。**仍未决的 `⚠?` 照常交付**，但交付说明里如实报「仍未决 N 处」", "pend": null, "sub": null}, "25": {"title": "25 停下报出（仪器故障）", "subject": "脚本", "executor": "出错的那个脚本", "input": "逐条硬错误 / 读不了的输入", "basis": "仪器故障退 2、内容不合退 1（`SKILL.md` 校验段）", "output": "停下的理由 + 可执行的下一步", "up": "12、21", "time": null, "route": "—", "desc": "**这一支专门收\"跑不动\"**：路径打错、文件读不了、JSON 坏掉——那不是\"表写错了\"，**改表没用、重试也没用**。说清三件事：哪个命令、读的哪份东西、下一步干什么（补依赖 / 换路径 / 重新生成）。**它不产出交付物**", "pend": null, "sub": null}, "26": {"title": "26 本次不出图", "subject": "AI", "executor": "AI", "input": "`plan.md`（0 条流程）", "basis": "没有流程也是一种交付（`SKILL.md` 计划段）", "output": "一句结论 + 排除清单", "up": "10b", "time": null, "route": "—", "desc": "交付的是**结论**：材料里没有可画的过程，附上排除清单与理由（每份材料为什么不参与）。⚠ 不许为了让交付\"有东西\"而把条款硬塞成节点——那正是 `material-to-nodes` §3 警告的那件事", "pend": null, "sub": null}, "parts/读回现状/flowtable.md::02a": {"title": "02a 开工先读现状", "subject": "AI", "executor": "AI", "input": "原始材料", "basis": null, "output": null, "up": null, "time": null, "route": "→手上有流程表吗？", "desc": "**每轮开工第一件事：手上有什么就读什么**——这一步的全部意义就是它", "pend": null, "sub": null}, "parts/读回现状/flowtable.md::02b": {"title": "02b 手上有流程表吗？", "subject": "AI", "executor": "AI", "input": "原始材料", "basis": "流程表由自身 frontmatter 认领（`id` / `level`，H9）", "output": "有 / 没有", "up": "02a", "time": null, "route": "有→读回现状（只读）\n没有→复述材料要点", "desc": "★ 只看\"有没有《流程表》\"这一件东西，不评它写得对不对——那是 12 的事", "pend": null, "sub": null}, "parts/读回现状/flowtable.md::02c": {"title": "02c 读回现状（只读）", "subject": "脚本", "executor": "clarify.py", "input": "已有流程表", "basis": "`⚠` / `⚠?` 的分拣口径（`references/flowtable-spec.md` §2）", "output": "推断项与未决项清单", "up": "02b", "time": null, "route": "→请用户当场纠正", "desc": "报出哪些是 AI 推断、哪些还没定；**只读不写**——它不改表，也不替 14 算 frontier", "pend": null, "sub": null}, "parts/读回现状/flowtable.md::02d": {"title": "02d 复述材料要点", "subject": "AI", "executor": "AI", "input": "原始材料", "basis": null, "output": "要点复述", "up": "02b", "time": null, "route": "→请用户当场纠正", "desc": "没有表就把材料要点复述一遍：复述是**给用户挑错用的**，不是摘要", "pend": null, "sub": null}, "parts/读回现状/flowtable.md::02e": {"title": "02e 请用户当场纠正", "subject": "用户", "executor": "用户", "input": "推断项与未决项 或 要点复述", "basis": null, "output": "纠正后的口径", "up": "02c、02d", "time": null, "route": "→口径已对齐", "desc": "**已问过并已定的不重复问**——\"还剩哪些要问\"由 14 独家算，这里只把现状摆出来", "pend": null, "sub": null}, "parts/读回现状/flowtable.md::02f": {"title": "02f 口径已对齐", "subject": "AI", "executor": "AI", "input": "纠正后的口径", "basis": null, "output": "对齐后的口径", "up": "02e", "time": null, "route": "—", "desc": "首轮无表直接往下不算空转：先看清现状，再动笔", "pend": null, "sub": null}, "parts/侦查/flowtable.md::04a": {"title": "04a 读材料层", "subject": "脚本", "executor": "recon.py", "input": "`materials[]`", "basis": "探测分档（`SKILL.md` 读材料段）", "output": "每份材料一行事实", "up": null, "time": null, "route"   [].forEach.call(svg.querySelectorAll('g.ndg'), function (g) {
    /* 悬停配对用 **`data-nid`（DSL 的原始节点编号）**，与边的 `data-from/to` 同口径（见 D-90）：
       `data-id` 是 TIPS 的键、子视图里带 `视图key::` 前缀（防跨表重号），拿它去比 `data-from`
       永远不相等——子视图于是"悬停什么也不亮"（用户报的"流光效果没有"）。
       主视图没有前缀、两者取值相同，所以这个 bug 只在子视图里显形。 */
    g.addEventListener('mouseenter', function () { focus(g.getAttribute('data-nid')); });
    g.addEventListener('mouseleave', clear);
  });
  }
  [].forEach.call(document.querySelectorAll('svg'), wire);
})();

/* 单文件多视图（见 D-52）：子图**内嵌在本文件里**，下钻 = 切视图，不再跳页。
   发给客户的就是这一个文件，整个层级都在里面，不依赖子目录里的任何 html。 */
var _views = [].slice.call(document.querySelectorAll('.view'));
var byKey = {};
_views.forEach(function(v){ byKey[v.dataset.view] = v; });
var _h1 = headmod ? headmod.querySelector('h1') : null;
var _crumbs = document.getElementById('crumbs');
var _baseCrumb = _crumbs ? _crumbs.innerHTML : '';
var _trail = ['__main__'];
function _esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _ensureCrumbs(){
  if (_crumbs) return _crumbs;
  /* 顶层主图没有"回程路"，HTML 里不必先摆一个空条——等真下钻了再建，
     建的时候补上 has-crumbs，让标题模块让位（两个都是 fixed，重叠就谁也看不见）。 */
  _crumbs = document.createElement('div');
  _crumbs.id = 'crumbs'; _crumbs.className = 'crumbs';
  document.body.insertBefore(_crumbs, document.body.firstChild);
  if (headmod) headmod.classList.add('has-crumbs');
  _crumbs.addEventListener('click', function(ev){
    var el = ev.target;
    while (el && el !== _crumbs) {
      var g = el.getAttribute && el.getAttribute('data-go');
      if (g) { go(g); return; }
      el = el.parentNode;
    }                                /* 服务端给的"返回父图"链接没有 data-go：走浏览器默认行为 */
  });
  return _crumbs;
}
var _trail = ['__main__'];
function vhash(k){ return '#' + encodeURIComponent(k === '__main__' ? 'main' : k); }
function keyOfHash(){
  var h = location.hash.replace(/^#/, '');
  if (!h || h === 'main') return '__main__';
  try { h = decodeURIComponent(h); } catch (e) {}
  return byKey[h] ? h : '__main__';
}
function _crumbsHtml(){
  var out = _baseCrumb, n = _trail.length;
  if (!out && n <= 1) { if (_crumbs) _crumbs.style.display = 'none'; return; }
  var el = _ensureCrumbs();
  el.style.display = '';
  _trail.forEach(function(k, i){
    var v = byKey[k]; if (!v) return;
    var nm = _esc(v.dataset.title || k);
    if (i > 0 || out) out += '<span class="sep"> \u203a </span>';
    out += (i === n - 1) ? '<span class="here">' + nm + '</span>'
                         : '<a href="javascript:void 0" data-go="' + _esc(k) + '">' + nm + '</a>';
  });
  el.innerHTML = out;
}
function showView(key, setHash){
  var v = byKey[key]; if (!v) return;
  saveScroll();                      /* 先存"离开的这一层"——此时 SCROLL_KEY 还是它的 */
  _views.forEach(function(x){ x.classList.toggle('cur', x === v); });
  if (_h1) _h1.innerText = v.dataset.title || '';
  /* 每层各记各的视窗位置：单文件里 location.pathname 不再区分层级，键必须带上视图 key */
  SCROLL_KEY = 'fc-scroll:' + location.pathname + '#' + key;
  _crumbsHtml();
  fitHead();                         /* 换了视图，标题可能换行变高，body 顶部留白要重算 */
  restoreScroll();
  if (setHash && location.hash !== vhash(key)) location.hash = vhash(key);
}
function go(key){
  if (!byKey[key]) return;
  var i = _trail.indexOf(key);
  if (i >= 0) _trail = _trail.slice(0, i + 1); else _trail.push(key);
  showView(key, true);
}
window.addEventListener('hashchange', function(){
  var k = keyOfHash();
  if (k === _trail[_trail.length - 1]) return;
  _trail = (k === '__main__') ? ['__main__'] : ['__main__', k];
  showView(k, false);
});
_crumbsHtml();
(function(){ var k = keyOfHash(); if (k !== '__main__') { _trail = ['__main__', k]; showView(k, false); } })();
</script>
</body>
</html>
