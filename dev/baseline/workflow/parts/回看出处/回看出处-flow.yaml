  subject: AI
  executor: AI
  row: 2
  col: 2
  stage: 留痕二档
  route: →13f
  desc: ★ 红 + 密虚线，与 `⚠` 一眼分得开；**不同选法后果不同**的才配这一档
  input: AI 推不出的内容
  basis: '`⚠?` = 必须业务方拍板（`references/flowtable-spec.md` §2）'
  output: 带 `⚠?` 的描述
