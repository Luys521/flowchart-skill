  subject: AI
  executor: AI
  row: 1
  col: 1
  stage: 判出处
  route: 有→13c ｜ 常理→13d ｜ 推不出→13e
  desc: 三档不是程度差别，是**来源差别**：材料说的、AI 补的、没人能定的
  input: 一行内容
  basis: 「依据」与 `⚠` 的分工（`references/flowtable-spec.md` §2）
  output: 有出处 / 按常理补 / 推不出
