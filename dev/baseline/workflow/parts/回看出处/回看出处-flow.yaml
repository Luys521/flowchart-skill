  subject: AI
  executor: AI
  row: 2
  col: 1
  stage: 照写
  route: →13f
  desc: 有出处就照写，**不要顺手改写措辞**——改过的措辞再也指不回原文
  input: 材料原文
  output: 保留原话的该行
- id: 13d
  name: 标 ⚠ 并写明依据
  lines:
  - 标 ⚠ 并写明依据
  type: task
  subject: AI
  executor: AI
  row: 2
  col: 0
  stage: 留痕一档
  route: →13f
  desc: ★ 橙 + 疏虚线；悬浮框首行说明"此处为 AI 推断，原文未载明"
  input: AI 补的内容
  basis: '`⚠` = 有依据的推断（`references/flowtable-spec.md` §2）'
  output: 带 `⚠` 的描述
- id: 13e
