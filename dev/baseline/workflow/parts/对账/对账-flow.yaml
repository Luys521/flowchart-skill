meta:
  title: 对账：拿表去比"已经知道的"，把"表错了"和"还没看"分开
  subjects:
    用户:
      fill: '#dae8fc'
      stroke: '#6c8ebf'
    AI:
      fill: '#d5e8d4'
      stroke: '#82b366'
    脚本:
      fill: '#ffe6cc'
      stroke: '#d79b00'
  layout: flow
layout:
  col_x: []
  right_channel_step: 60
  width: 700
  origin_x: -280
nodes:
- id: 20a
  name: 读表与三本账
  lines:
  - 读表与三本账
  type: start
  subject: 脚本
  executor: drift.py
  row: 0
  col: 0
  stage: 入口
  route: →20b
  desc: 三源 = 证据账本 / 假设账 / 表自身。少给哪一本就**如实打印"这一条跳过"**——那是"没跑"，不是"跑了没命中"，两句话不许混
  input: 流程表 + 账本 + 假设账 + 清点
  basis: '"已知"只有三源（`SKILL.md` 循环段）'
  output: 节点级引用表
- id: 20b
  name: 跑 D1—D5
  lines:
  - 跑 D1—D5
  type: task
  subject: 脚本
  executor: drift.py
  row: 1
  col: 0
  stage: 判据
  route: →20c
  desc: 五条判据各有正反，缺一条就是"看着全绿其实没查"。★ **只有 `quote 截断` 的降级不算等级拔高**——不分开时，一份规矩引条款的表会被报成一串假漂移（真材料上实测过）
  time: 2-10 秒
  input: 节点级引用表 + 三本账
  basis: D1—D5 的口径（`SKILL.md` 循环段）
  output: 每条判据的命中清单
- id: 20c
  name: 命中的是哪一类？
  lines:
  - 命中的是哪一类？
  type: decision
  subject: 脚本
  executor: drift.py
  row: 2
  col: 0
  stage: 分流
  route: 漂移→20d ｜ 缺口→20e
  desc: ★ 这一分是整张表存在的理由：**漂移指责表**（等级拔高 / 假设被推翻仍在用 / 建立在读不动的材料上），**缺口派活**（含流程的材料零引用
    / 读了没用上）。混成一堆，"该改表"和"该去读"就分不开了
  input: 命中清单
  basis: '"表写错了"与"还有没看"的二分'
  output: 漂移 / 缺口
- id: 20d
  name: 出漂移账
  lines:
  - 出漂移账
  type: task
  subject: 脚本
  executor: drift.py
  row: 3
  col: 0
  stage: 漂移账
  route: →20f
  desc: '`处置` 与 `依据` 两列留给 AI。判 `已修` 会被**重跑判据验真**（说谎会被抓住）；判 `已解释` 必须写依据——不许用"影响不大"抹平'
  input: 漂移清单
  basis: '`处置` ∈ `已修` / `已解释`，**不留 `待验`**'
  output: 带 AI 两列的漂移账
- id: 20e
  name: 出缺口清单
  lines:
  - 出缺口清单
  type: task
  subject: 脚本
  executor: drift.py
  row: 3
  col: 1
  stage: 缺口单
  route: →20f
  desc: '`已取证` 要写清要哪一片；`已放弃` 要写理由（**不许静默放弃**）；`待取证` 是草稿态，收敛时不许留'
  input: 缺口清单
  basis: 每条给「走哪条路」
  output: 带「要哪一片 / 状态 / 说明」的缺口单
- id: 20f
  name: 算依据分布
  lines:
  - 算依据分布
  type: task
  subject: 脚本
  executor: drift.py
  row: 4
  col: 0
  stage: 读数
  route: →20g
  desc: ★ 量的是"这张表的事实面有多宽"：头名材料撑了多数节点、或某一段只落在一份材料上，都是**去核对哪一段**的方向；它不出漂移、不出缺口、不进收敛口径
  input: 节点级引用表
  basis: 它是**读数，不是判据**
  output: 每份材料撑几个节点 + 连续段
- id: 20g
  name: 账目对得上吗？
  lines:
  - 账目对得上吗？
  type: decision
  subject: 脚本
  executor: drift.py
  row: 5
  col: 0
  stage: 收尾
  route: 对得上→20h ｜ 对不上→20i
  desc: 两条对账都要过：标 `已修` 的必须**真的不再命中**；现在命中的必须**都在账内**（漏在账外 = 静默放过）
  input: 漂移账 + 缺口单
  basis: '`check` 重跑判据与账对账'
  output: 对得上 / 对不上
- id: 20h
  name: 账目自洽，交收敛判断
  lines:
  - 账目自洽，交收敛判断
  type: end
  subject: 脚本
  executor: drift.py
  row: 6
  col: 0
  stage: 收敛
  route: —
  desc: '"收敛了吗"是**主表 21** 的判断（硬漂移 0 且没有「待取证」）；本表只保证账目自洽——**这两件事不许互相代替**'
  input: 校验通过的 `drift.md`
  output: '`drift.md`'
- id: 20i
  name: 退 1，报出对不上的地方
  lines:
  - 退 1，报出对不上的地方
  type: end
  subject: 脚本
  executor: drift.py
  row: 7
  col: 0
  stage: 退回
  route: —
  desc: 说清是哪一条、账与表差在哪。仪器故障（形状坏 / 读不了）才是退 2——与"内容不合"分开
  input: 对不上的格子
  output: 逐条报错
