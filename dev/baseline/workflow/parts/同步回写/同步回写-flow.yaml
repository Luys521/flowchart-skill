meta:
  title: 同步闭环：读回 → 回写 → 重渲染
  subjects:
    用户:
      fill: '#dae8fc'
      stroke: '#6c8ebf'
    AI:
      fill: '#d5e8d4'
      stroke: '#82b366'
    脚本:
      fill: '#ffe6cc'
      stroke: '#d79b00'
  layout: flow
layout:
  col_x:
  - 400
  width: 680
  origin_x: -80
nodes:
- id: 11a
  name: 读回 drawio
  lines:
  - 读回 drawio
  type: start
  subject: 脚本
  executor: xml_reader.py
  row: 0
  col: 0
  stage: 读回
  route: →11b
  desc: 用户在图上可以自由编辑，读回时不做限制：**能读回的只有名称、形状、连线与坐标**——语义属性图里一个都不写（见 `references/visual-spec.md`
    §1），所以读不回也不该读回
  input: drawio 文件
  basis: 外部图的读回规则（`references/import-existing.md` §1）
  output: 节点 / 边 / 几何
- id: 11b
  name: 与流程表比差异
  lines:
  - 与流程表比差异
  type: task
  subject: 脚本
  executor: sync.py
  row: 1
  col: 0
  stage: 对比
  route: →11c
  desc: 差异分四类：**增删节点**、**关系变化**、**文字变化**（名称 / 类型 / 标签）、**坐标位移**。前三类是语义，只有第四类是几何；**四类都空就是图上什么都没动**（主表据此直接交付）；判据是
    `(标签, 目标)` 配对——没碰过的分支，回写后一字不差
  input: 图 + 流程表
  basis: 差异四分类（增删节点 / 关系变化 / 文字变化 / 坐标位移）
  output: 差异清单
- id: 11c
  name: 「下个节点」冲突？
  lines:
  - 「下个节点」冲突？
  type: decision
  subject: 脚本
  executor: sync.py
  row: 2
  col: 0
  stage: 冲突
  route: 有→11d ｜ 没有→11e
  desc: ★ 表说某条分支去 A、图里却去 B：这是方向性冲突，不是正常增删，不能静默覆盖
  input: 差异清单
  basis: '`(标签, 目标)` 配对——表说 A、图说 B'
  output: 有 / 没有
- id: 11d
  name: 拦下并回报
  lines:
  - 拦下并回报
  type: end
  subject: 脚本
  executor: sync.py
  row: 3
  col: 0
  stage: 拦截
  route: —
  desc: 退出码 1，流程表不动；哪边对由主表 03 裁决——表对就重跑 08 让图跟上，图对就回 03 把表改对
  input: 冲突清单
  output: 拦截报告（退出码 1）
- id: 11e
  name: 回写流程表
  lines:
  - 回写流程表
  type: end
  subject: 脚本
  executor: sync.py
  row: 4
  col: 0
  stage: 回写
  route: —
  desc: 语义（名称 / 类型 / 标签 / 走向 / 输入 / 依据 / 输出）的落点是流程表，写回完毕即本表终点；"接下来往哪走"是主表的判断（都没变→交付
    ｜ 改了语义→回 03 重落表 ｜ 只动几何→回 08 重布局）。几何只落进 DSL，交回算法定终值
  input: 差异清单 + 原表
  basis: 最小差异原则（原文一致的分支逐字回填）
  output: 更新后的流程表
edges:
- from: 11a
  to: 11b
  kind: spine
  polarity: main
- from: 11b
  to: 11c
  kind: spine
  polarity: main
- from: 11c
  to: 11d
  kind: spine
  polarity: main
  label: 有
- from: 11c
  to: 11e
  kind: jumpR
  polarity: main
  label: 没有
