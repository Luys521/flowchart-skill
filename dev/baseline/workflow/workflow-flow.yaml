meta:
  title: flowchart-skill 自举：一条流程从材料到交付
  subjects:
    用户:
      fill: '#dae8fc'
      stroke: '#6c8ebf'
    AI:
      fill: '#d5e8d4'
      stroke: '#82b366'
    脚本:
      fill: '#ffe6cc'
      stroke: '#d79b00'
  layout: flow
layout:
  col_x:
  - 400
  width: 680
  origin_x: -80
nodes:
- id: '01'
  name: 收到材料
  lines:
  - 收到材料
  type: start
  subject: 用户
  executor: 用户
  row: 0
  col: 0
  stage: 读材料
  route: →01a
  desc: ⚠? 材料没写「从哪一步开始、到哪一步结束」时**必须问用户拍板**——起止范围不同，整张表的边界就不同（不同选法后果不同）。触发形态不限：口头需求
    / 合同文档 / 表格 / 图片白板 / **已被直接改过的流程表**；**07 的答复也从这里进来**——每轮补充的信息都是新材料，这张表的入口不止开一次
  input: 原始材料、起止范围
  output: 原始材料（转交 01a）
- id: 01a
  name: 建目录
  lines:
  - 建目录
  type: task
  subject: 脚本
  executor: init.py
  row: 1
  col: 0
  stage: 建目录
  route: →02
  desc: ⚠ 材料没给流程名时按材料主题起一个（原文未写、按惯例补）。`init.py` 建 `output/<名称>/` 并把 `templates/` 两份模板拷进去——**目录名就是流程身份**，产物名跟着它走
  time: 1-2 秒
  input: 流程名称
  basis: 两份模板与目录约定（`SKILL.md` 第 1 环）
  output: '`output/<名称>/` + 两份模板'
- id: '02'
  name: 读回现状对齐口径
  lines:
  - 读回现状对齐口径
  type: task
  subject: AI
  executor: AI
  row: 2
  col: 0
  stage: 读材料
  route: →03
  desc: ⊞ parts/读回现状/flowtable.md；**每轮开工第一件事：手上有什么就读什么**——已有流程表就用 `clarify.py` 读回来（它只读不写），报出哪些是
    AI 推断、哪些还没定；没有表就把材料要点复述一遍，给用户当场纠正的机会。**已定的不重复问**——「还剩哪些要问」由 06 独家算
  input: 已有流程表（可无）
  basis: '`⚠` / `⚠?` 的分拣口径（`references/flowtable-spec.md` §2）'
  output: 现状复述
- id: '03'
  name: 落流程表
  lines:
  - 落流程表
  type: task
  subject: AI
  executor: AI
  row: 3
  col: 0
  stage: 落表
  route: →04
  desc: ⊞ parts/落表/flowtable.md；★ 全流程**唯一**的语义落笔点：校验不通过、用户答复、图上的语义改动、表被直改，都回到这里改表。**列填不满的地方，就是流程没说清的地方**——主动提问、给出候选、补上缺失项
  input: 材料 + 缺失列的答复
  basis: 字段登记表（`references/flowtable-spec.md` §2）
  output: 十二列流程表
- id: '04'
  name: 结构校验？
  lines:
  - 结构校验？
  type: decision
  subject: 脚本
  executor: table_to_dsl.py
  row: 4
  col: 0
  stage: 校验
  route: 通过→05 ｜ 不通过→回 03 修正
  desc: ⊞ parts/结构校验/flowtable.md；三层校验（① 节点：编号 / 语义 · ② 类型：起止、出边、分支 · ③ 关系：引用、连通、回路），硬错误**阻断渲染**
  input: 流程表
  basis: H1–H8 + 表头 H9（`references/flowtable-spec.md` §3）
  output: 通过，或逐条硬错误
- id: '05'
  name: 逐行回看内容出处
  lines:
  - 逐行回看内容出处
  type: task
  subject: AI
  executor: AI
  row: 5
  col: 0
  stage: 标注
  route: →06
  desc: ⊞ parts/回看出处/flowtable.md；材料说的照写；AI 按常理补的打 `⚠` 并写明依据；推不出的打 `⚠?`。**打标不阻断**——标完照常往下，仍未决的由
    06 报出
  input: 流程表
  basis: 依据不来自材料就标 `⚠`（`references/flowtable-spec.md` §2）
  output: '`⚠` / `⚠?` 留痕'
- id: '06'
  name: 有待裁决项？
  lines:
  - 有待裁决项？
  type: decision
  subject: 脚本
  executor: clarify.py
  row: 6
  col: 0
  stage: 标注
  route: 有→07 ｜ 没有→08
  desc: '`clarify.py` 算出 frontier（当前能问的）——这是**算出来的状态**，不是看法；**只问 frontier 里的**，上游还没定的先不问。frontier
    为空即收敛'
  input: 流程表
  basis: frontier = 前驱已定的 `⚠?`，只问当前可问的
  output: frontier 清单
- id: '07'
  name: 问并收答复
  lines:
  - 问并收答复
  type: task
  subject: 用户
  executor: 用户
  row: 7
  col: 0
  stage: 标注
  route: →回 01 当新材料
  desc: 每问附 AI 的推荐答案，用户只需否决。**与 03 的分工**：03 问的是「列填不满」，这里问的是「两条路都说得通、必须业务方拍板」。**答复是新材料**——收完回
    01 重走一圈再落表，不在问答处就地改表。仍有未决的照常交付，但交付时如实报「仍未决 N 处」
  input: frontier 清单
  output: 答复（新材料）
- id: 08
  name: 渲染三份视图
  lines:
  - 渲染三份视图
  type: task
  subject: 脚本
  executor: build.py
  row: 8
  col: 0
  stage: 出图
  route: →09
  desc: ⊞ parts/渲染/flowtable.md；一条命令跑六环，任一环不过即 exit 1 并把产物还原——盘上不留没审过的交付物
  time: 5-30 秒
  input: 通过校验的流程表
  basis: 六环 + 产物侧九项判据（`references/visual-spec.md` §4.1）
  output: 三份产物 + 层级索引 + sha256 回执
- id: 09
  name: 视觉自检通过？
  lines:
  - 视觉自检通过？
  type: decision
  subject: AI
  executor: AI
  row: 9
  col: 0
  stage: 看
  route: 通过→10 ｜ 有问题→回 08 调几何
  desc: ⊞ parts/视觉自检/flowtable.md；用 `shot.py` 出图后**由 AI 看着核对**：交叉是否多到影响追踪、标签是否居中压线、分支走向是否反直觉。质量门禁只管几何，好不好看必须看图
  input: 三份产物
  basis: 看三样：交叉多不多 / 标签压不压线 / 走向反不反直觉（`references/visual-spec.md` §2）
  output: 看过的结论
- id: '10'
  name: 表被直改过吗？
  lines:
  - 表被直改过吗？
  type: decision
  subject: 脚本
  executor: table_to_dsl.py
  row: 10
  col: 0
  stage: 回流
  route: 有→回 03 重走 ｜ 没有→11
  desc: ★ 拿 `flowtable.md` 现算指纹，对照上次渲染写进 `<流程名>-flow.manifest.json` 的那一份（`table_to_dsl.py
    --fresh`）：**变过**说明有人绕过流水线改了事实源，回 03 重走校验与出图——**不许走 11**（回灌是按图里的节点集合重建表格行的，手工加的节点会被删掉、改过的名字会被覆盖）；**没变**→11
    看图上动了什么。没有基线时 `--fresh` 报「无从判断」，照样按「改过」走保守路线
  input: 流程表 + 上次渲染记进契约的指纹
  basis: 现算指纹 vs `source_sha256`（`references/dsl-spec.md` §3）
  output: 同版 / 已过期
- id: '11'
  name: 读回并分拣改动
  lines:
  - 读回并分拣改动
  type: task
  subject: 脚本
  executor: sync.py
  row: 11
  col: 0
  stage: 回流
  route: 都没变→12 ｜ 改了语义→回 03 重落表 ｜ 只动几何→回 08 重布局
  desc: ⊞ parts/同步回写/flowtable.md；**图这一面不另存指纹——本来就要解析**：元素与关系都没变、只有坐标位移 → 几何，回 08
    交算法判吸附阈值（**像素不作终值**）；**增删节点 / 改关系 / 改文字（含名称、标签、形状）→ 语义**，先回写进流程表，再回 03 重走校验与出图。两者都有时按语义走；**diff
    为空即静默通过**，不许因格式噪声把人拉回 03
  time: 2-10 秒
  input: drawio + 流程表
  basis: 差异四分类（增删节点 / 关系变化 / 文字变化 / 坐标位移）
  output: 回写后的流程表
- id: '12'
  name: 交付
  lines:
  - 交付
  type: end
  subject: 用户
  executor: 用户
  row: 12
  col: 0
  stage: 交付
  route: —
  desc: 三份视图（html 评审 / drawio 协作 / svg 中间态）+ `flowtable.md`（唯一事实源）+ `checklist.md`（自检报告）+
    `<流程名>-index.md`（层级索引，多张表时的构建顺序）。**有子表就一并发 `parts/`**——它和主表是同一份交付。产物末尾打印 sha256
    回执
  input: 11 的回写结果 + 全部产物
  output: 三份视图 + `flowtable.md` + `checklist.md` + `<流程名>-index.md`（子表在 `parts/` 下）
